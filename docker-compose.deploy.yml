services:
  backend:
    image: ${DOCKERHUB_NAMESPACE}/finflow-backend:${IMAGE_TAG:-latest}
    container_name: finflow-backend
    restart: unless-stopped
    env_file:
      - .env.deploy
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    image: ${DOCKERHUB_NAMESPACE}/finflow-frontend:${IMAGE_TAG:-latest}
    container_name: finflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
